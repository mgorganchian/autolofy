# Actualiza DOLAR_BNA (dólar billete vendedor del Banco Nación) en index.html.
# Corre en días hábiles después de los horarios en que el banco publica o cambia la cotización
# (abre a las 10 y la última actualización del día suele ser a las 17, hora argentina = UTC-3).
# Si la cotización cambió, deja el cambio en la rama dolar-bna con un PR con auto-merge: main está
# protegida y exige los controles Vercel y e2e. Un PR abierto por el GITHUB_TOKEN no dispara los
# workflows de pull_request, así que el e2e se larga a mano con workflow_dispatch sobre la rama.
name: dolar

on:
  schedule:
    - cron: '20 13 * * 1-5'   # 10:20
    - cron: '20 15 * * 1-5'   # 12:20
    - cron: '20 18 * * 1-5'   # 15:20
    - cron: '20 20 * * 1-5'   # 17:20
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  actions: write

concurrency: dolar

jobs:
  actualizar:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Bajar la cotización del BNA
        id: dolar
        run: |
          python3 herramientas-dolar.py
          if git diff --quiet; then echo "cambio=no" >> "$GITHUB_OUTPUT"; else echo "cambio=si" >> "$GITHUB_OUTPUT"; fi
      - name: PR con auto-merge
        if: steps.dolar.outputs.cambio == 'si'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          resumen=$(grep -o "venta: [0-9.]*, fecha: '[0-9-]*'" index.html)
          git switch -c dolar-bna
          git commit -am "Dólar BNA: ${resumen}"
          git push -f origin dolar-bna
          if [ -z "$(gh pr list --head dolar-bna --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head dolar-bna --title "Dólar BNA actualizado" \
              --body "La tarea dolar.yml bajó la cotización del billete vendedor de https://www.bna.com.ar/Personas (${resumen})."
          fi
          gh pr merge dolar-bna --auto --squash
          gh workflow run tests.yml --ref dolar-bna
